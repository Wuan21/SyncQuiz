name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - Quan

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Project
        run: |
          cd frontend
          npm run build
        env:
          VITE_BASE_PATH: /SyncQuiz/
          VITE_API_URL: https://syncquiz-backend.onrender.com/api
          VITE_SOCKET_URL: https://syncquiz-backend.onrender.com

      - name: Handle SPA Routing (Copy index to 404)
        run: |
          cp frontend/dist/index.html frontend/dist/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
