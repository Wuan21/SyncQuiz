services:
  - type: web
    name: syncquiz-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    healthCheckInterval: 30s
    healthCheckThreshold: 3
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: syncquiz
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://syncquiz-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        value: syncquiz-media
      - key: AWS_CLOUDFRONT_URL
        sync: false
      - key: AWS_SES_FROM_EMAIL
        sync: false
      - key: AWS_LAMBDA_THUMBNAIL_FN
        value: syncquiz-generate-thumbnail
      - key: AWS_COGNITO_USER_POOL_ID
        sync: false
      - key: AWS_COGNITO_CLIENT_ID
        sync: false
      - key: AWS_COGNITO_TOKEN_USE
        value: id
    autoDeploy: true
